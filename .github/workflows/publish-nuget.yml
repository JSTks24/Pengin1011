name: Build NuGet Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  pack:
    if: github.event_name == 'workflow_dispatch' || github.event.created
    runs-on: windows-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Check Out Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Check Project Version
        shell: pwsh
        run: |
          $version = dotnet msbuild Pengin1011.csproj -nologo -p:Configuration=Release -getProperty:Version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag '$env:GITHUB_REF_NAME' must match project version 'v$version'."
          }
          "PACKAGE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Build NuGet Package
        run: dotnet pack Pengin1011.csproj -c Release -warnaserror -o bin/nuget-release

      - name: Verify NuGet Package
        shell: pwsh
        run: ./Tests/Pengin1011.Tests/Test-ReleasePackage.ps1 -Tag $env:PACKAGE_TAG -PackageDirectory bin/nuget-release

      - name: Upload NuGet Package
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: module-sdk-${{ github.run_attempt }}
          path: bin/nuget-release/*.nupkg
          if-no-files-found: error

  win-build:
    needs: pack
    runs-on: windows-latest

    steps: &build-steps
      - name: Check Out Source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet Package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/pengin1011-nuget

      - name: Build Solution
        run: dotnet build Pengin1011.sln -c Release

      - name: Run Framework and Package Tests
        env:
          PENGIN1011_TEST_PACKAGE_SOURCE: ${{ runner.temp }}/pengin1011-nuget
        run: dotnet test Tests/Pengin1011.Tests/Pengin1011.Tests.csproj -c Release --no-build

  linux-build:
    needs: pack
    runs-on: ubuntu-latest

    steps: *build-steps

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    needs: [pack, win-build, linux-build]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write

    steps:
      - name: Set Up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download Tested NuGet Package
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.pack.outputs.artifact }}
          merge-multiple: true
          path: package

      - name: Sign In to NuGet
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet Package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "package/Pengin1011.ModuleSdk.${GITHUB_REF_NAME#v}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY"
